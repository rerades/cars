name: Langfuse alert

# Langfuse fires a repository_dispatch when an alert triggers (failed evals or a run that did not
# end ok). The factory runs at night, so this turns the alert into an issue waiting in the morning.
# The payload shape is Langfuse's, so it goes into the issue as-is instead of being parsed.
on:
  repository_dispatch:
    types: [langfuse-alert]

permissions:
  issues: write

jobs:
  issue:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # Through env, never interpolated into the script: the payload is external input.
          PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          # Langfuse also notifies on recovery (ALERT -> OK); that one needs no issue.
          # Documented shape nests fields under .payload; the fallback covers a flattened one.
          severity=$(jq -r '.payload.severity // .severity // ""' <<< "$PAYLOAD")
          if [ "$severity" = "OK" ]; then echo "Recovery, no issue."; exit 0; fi
          title=$(jq -r '.payload.message.title // .message.title // "Langfuse alert"' <<< "$PAYLOAD")
          printf 'Alert received from Langfuse.\n\n```json\n%s\n```\n' "$PAYLOAD" > body.md
          # --label fails if the label is missing; --force creates it or leaves it as is.
          gh label create langfuse --force --color 5319e7 --description "Alert from Langfuse"
          gh issue create --title "$title ($(date -u +%F))" --body-file body.md --label langfuse
