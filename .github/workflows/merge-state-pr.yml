name: Merge state PR

# Merges the factory state PR (chore/factory-state, "record factory runs") as soon as CI is green,
# with the rule of ADR-0013 point 6 (factory/run.ts --merge-state). It runs on main's code, never
# on the PR's: workflow_run always checks out the default branch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency: merge-state-pr

env:
  PNPM_VERSION: 11.19.0

jobs:
  merge:
    if: github.event.workflow_run.head_branch == 'chore/factory-state' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install -g pnpm@${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node factory/run.ts --merge-state
        env:
          GH_TOKEN: ${{ github.token }}
