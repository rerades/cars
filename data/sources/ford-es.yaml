notes: >
  Verificado (2026-10-14): www.ford.es es el dominio oficial de Ford en España y responde a la lectura automática. robots.txt permite el rastreo salvo rutas técnicas, cuentas de Ford Credit, páginas de ofertas, dashboard y búsqueda. La página /turismos/electricos da 404. Las fichas de modelo (Puma Gen-E, Explorer, Capri) no publican lista de versiones, potencia, batería ni PVP legibles: solo cuotas ("Desde 125€/mes", entrada, cuota final, 49 meses) y cifras de autonomía sin etiquetar. No se guarda ningún precio de Ford. Las versiones salen del IDAE (idae-es, T2) y de un medio (T3). Pendiente: configurador o tarifa de precios legible con PVP. Sin verificar: Mach-E (la ficha no apareció en el buscador) y furgonetas E-Transit. Verificado (2026-10-15): las fichas /turismos/e-tourneo-courier y /turismos/e-tourneo-custom responden. Courier: solo cuotas de financiación, autonomía hasta 320 km y carga CC de 100 kW; Custom: título «Monovolumen Versátil», autonomía hasta 339 km, acabados Trend, Titanium, Active, Sport y Titanium X; ninguna publica PVP, batería ni potencia. Verificado (2026-11-01, fetch-page.ts): cargan bien las fichas de Puma Gen-E, Explorer, Capri, E-Tourneo Courier y E-Tourneo Custom y el índice /hibridos-electricos/electricos; ninguna da PVP (solo cuotas desde 125-145 €/mes o nada). Courier: entrada 10.150 € (antes 10.550 €), cuota final 15.077 €. La ficha del Puma ya no muestra cuota.
