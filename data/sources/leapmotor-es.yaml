notes: >
  Verificado (2026-10-13): https://www.leapmotor.es no se puede leer (error TLS); la web con selector "Spain | ES-ES" es
  leapmotor.net/es-es (dominio global de la marca; pie "© 2025 Leapmotor"). Sus términos dicen «Este es el sitio web oficial de Leapmotor
  International B.V.», empresa conjunta de Stellantis N.V. y Zhejiang Leapmotor (revisión humana, 2026-10-13). robots.txt: Googlebot sin restricciones; el resto, solo
  bloquea /kw-*, /qa-*, /uae-*. Gama en la web: T03, B03X, B05, B10 y C10 (BEV), más variantes EV híbrido (REEV, no BEV). Los
  precios "desde" de cada ficha descuentan 3.375 € del Plan Auto+ y 900 € de la venta del certificado CAE (válidos hasta el
  31/10/2026): incluyen ayudas, así que no son PVP sin ayudas ni se guardan. Las fichas son poco explícitas sobre qué dato
  pertenece a qué versión; las cifras por versión se toman del IDAE (idae-es) y de la ficha solo lo claro.
  Sala de prensa (2026-10-27): /es-es/descubre-leapmotor/noticias (enlazada en el menú «Descubre Leapmotor > Noticias») da 404 con fetch-page.ts
  y con WebFetch, igual que /es-es/noticias y /es-es/descubre-leapmotor/news; no hay otra página de noticias o prensa en leapmotor.net/es-es,
  así que se quita urls.press. Un buscador apunta a https://www.media.stellantis.com/es-es/leapmotor/press (sala de prensa de Stellantis, otro
  dominio, no verificada ni registrada como fuente de Leapmotor): decisión humana si se registra.
