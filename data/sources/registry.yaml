# Registro de fuentes de datos — lo mantiene el agente Researcher.
# Ver docs/architecture/adr/0001-fuentes-de-datos.md
#
# Esquema de cada entrada:
# - id: tesla-es                 # único, kebab-case: <marca>-<país|press|eu>
#   brand: Tesla
#   tier: T1                     # T1 | T2 | T3
#   market: ES                   # ES | EU | FR | DE ... | global
#   kind: [prices, specs, images, announcements]
#   urls:
#     models: https://...
#     prices: https://...        # lista de precios / configurador
#     press: https://...         # sala de prensa (imágenes)
#   image_license: ""            # términos de uso de imágenes y atribución exigida
#   notes: ""
#   last_verified: YYYY-MM-DD
#   status: active               # active | broken | deprecated

sources:
  - id: cupra-es
    brand: Cupra
    tier: T1
    market: ES
    kind: [prices, specs, announcements]
    urls:
      home: https://www.cupra.com/es-es/   # cupraofficial.es redirige (301) aquí
      models: https://www.cupra.com/es-es/coches/born   # también /tavascan y /raval
      prices: https://www.cupra.com/es-es/carshop/w/model?wf=cupra-es-es   # configurador
      news: https://www.cupra.com/es-es/universo-cupra/noticias
    image_license: ""   # sin licencia clara registrada: no publicar imágenes de esta web
    notes: >
      robots.txt (cupra.com) solo bloquea /*/mycupra/, /*/private-area/ y login; modelos
      y precios permitidos. BEV vistos en la home: Born, Tavascan, Raval.
      Verificado (2026-09-23): el configurador y las fichas de modelo (p.ej. /coches/born)
      NO muestran un PVP limpio. El único precio visible es un "PVP recomendado
      financiando" ligado a una oferta de financiación, con nota a pie de página que dice
      literalmente "descuento de marca y concesionario y bonificación Volkswagen Bank GmbH
      S.E. incluidos" y una cuota final condicionada a "la ayuda del Plan Auto +". Es decir,
      el PVP mostrado incluye descuentos de marca/concesionario y una bonificación
      financiera, por lo que NO cumple la regla de ADR-0001 (PVP sin ayudas ni incentivos).
      No usar este precio como fuente de precio hasta localizar un PVP oficial sin
      descuentos ni condiciones de financiación. Pendiente: buscar una lista de precios o
      ficha técnica sin oferta de financiación asociada.
    last_verified: 2026-09-23
    status: active

  - id: cupra-press
    brand: Cupra
    tier: T1
    market: global
    kind: [images, announcements]
    urls:
      press: https://www.seat-cupra-mediacenter.com/CUPRA-Brand   # SEAT S.A. Media Center
      legal: https://www.seat-cupra-mediacenter.com/legal/legal-note
    image_license: ""   # pendiente: la nota legal solo regula contenido enviado por usuarios; no define licencia de las imágenes de prensa
    notes: >
      Un resultado de búsqueda (T3) afirma "libre de derechos para uso editorial", pero no
      está confirmado en la web oficial: no se registra como licencia. Home del media center
      verificada; no se ha verificado la sección CUPRA-Brand ni su robots.txt.
    last_verified: 2026-09-21
    status: active

  - id: polestar-es
    brand: Polestar
    tier: T1
    market: ES
    kind: [prices, specs, announcements]
    urls:
      home: https://www.polestar.com/es/
      models: https://www.polestar.com/es/polestar-2/   # también /polestar-3, /polestar-4, /polestar-5 (announced)
      prices: https://www.polestar.com/es/configure/polestar-2/   # configurador; también existe /es/stock-cars/polestar-2/
    image_license: ""   # sin licencia clara registrada: no publicar imágenes de esta web
    notes: >
      robots.txt (polestar.com) solo bloquea /*/sign-up-newsletter/; el resto permitido.
      BEV vistos en la home ES: Polestar 2 (PVP 41.900 €, confirmado sin ayudas en la
      ficha del modelo), Polestar 3, Polestar 4 (Coupé desde 49.900 €, SUV desde 54.390 €)
      y Polestar 5 (aún sin PVP visible, posible "announced").
      Verificado (2026-09-24): los precios de P2 (41.900 €), P3 (81.900 €) y P4 Coupé
      (49.900 €) llevan nota a pie "descuento exclusivo de marca" y validez hasta 30/09/2026:
      no son PVP limpio, se guardan como price_kind financed. (Corrige la nota anterior
      que daba 41.900 € como "sin ayudas".)
    last_verified: 2026-09-24
    status: active

