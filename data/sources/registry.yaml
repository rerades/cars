    image_license: ""   # sin licencia clara registrada: no publicar imágenes de esta web
    notes: >
      Verificado (2026-10-03): www.opel.es (home, robots.txt, fichas, ofertas) devuelve 403 a la
      lectura automática (protección de acceso, no se evita). Solo ofertas.opel.es responde. Allí
      las páginas por modelo (Corsa, Mokka, Frontera) dicen "Disponible en Gasolina, Híbrido o
      Eléctrico" pero el precio al contado mostrado es el de la versión térmica/híbrida (Mokka
