# Registro de fuentes de datos — lo mantiene el agente Researcher.
# Ver docs/architecture/adr/0001-fuentes-de-datos.md
#
# Esquema de cada entrada:
# - id: tesla-es                 # único, kebab-case: <marca>-<país|press|eu>
#   brand: Tesla
#   tier: T1                     # T1 | T2 | T3
#   market: ES                   # ES | EU | FR | DE ... | global
#   kind: [prices, specs, images, announcements]
#   urls:
#     models: https://...
#     prices: https://...        # lista de precios / configurador
#     press: https://...         # sala de prensa (imágenes)
#   image_license: ""            # términos de uso de imágenes y atribución exigida
#   notes: ""
#   last_verified: YYYY-MM-DD
#   status: active               # active | broken | deprecated

sources:
  - id: cupra-es
    brand: Cupra
    tier: T1
    market: ES
    kind: [prices, specs, announcements]
    urls:
      home: https://www.cupra.com/es-es/   # cupraofficial.es redirige (301) aquí
      models: https://www.cupra.com/es-es/coches/born   # también /tavascan y /raval
      prices: https://www.cupra.com/es-es/carshop/w/model?wf=cupra-es-es   # configurador
      news: https://www.cupra.com/es-es/universo-cupra/noticias
    image_license: ""   # sin licencia clara registrada: no publicar imágenes de esta web
    notes: >
      robots.txt (cupra.com) solo bloquea /*/mycupra/, /*/private-area/ y login; modelos
      y precios permitidos. BEV vistos en la home: Born, Tavascan, Raval.
      Verificado (2026-09-24): las fichas de modelo (/coches/born, /tavascan, /raval) NO
      muestran un PVP limpio. El único precio es un "PVP recomendado financiando" ligado a
      una oferta de Volkswagen Bank (descuento de marca y concesionario, bonificación,
      permanencia 48 meses, crédito mínimo 10.000 €). Según ADR-0001 (regla 1) es usable
      como price_kind: financed, con el texto literal en price_terms. Nunca como pvp.
      Registrados en data/raw/cupra/: Born+ 35.655,59 €, Tavascan 58 kWh 36.272,53 €,
      Raval Endurance 31.222,74 € (oferta válida hasta 30/09/2026). Sin precio para el
      resto de versiones. Pendiente: buscar un PVP sin oferta (lista de precios/ficha
      técnica); la nota de Born quedó truncada en la lectura y hay que completarla.
    last_verified: 2026-09-24
    status: active

