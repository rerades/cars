notes: >
  Base de datos de vehículos del IDAE (Ministerio para la Transición Ecológica): datos WLTP de homologación de los
  coches vendidos en España, por versión. T2 como documentación de homologación (ADR-0001). Da autonomía WLTP, potencia
  eléctrica, capacidad de batería (sin decir si es útil o bruta: basis unknown), consumo y MTMA. No da precio ni dice
  qué versiones siguen a la venta: mezcla homologaciones actuales y antiguas. Se lee con
  `node factory/fetch-idae.ts <MARCA>`, porque la tabla llega por un POST con token que WebFetch no envía. robots.txt
  lo permite todo (comprobado el 2026-10-09). Registrada a mano para Tesla, cuya web bloquea toda lectura automática.
  Términos (2026-11-26): el aviso legal de idae.es solo permite un uso privado y personal de los contenidos salvo
  consentimiento previo por escrito del IDAE. El responsable lo pidió por escrito el 2026-11-24 (SICER) para el CSV
  histórico y el buscador, y la División de Movilidad y Ciudades Sostenibles del IDAE contestó el 2026-11-26: «los
  datos públicos que ofrece IDAE, se pueden utilizar siempre que se mencione la fuente». La fuente se puede usar
  (regla 6 de ADR-0001) con los compromisos de la petición: solo eléctricos puros; los datos tal cual, sin cambiar su
  sentido; cada dato cita al IDAE con enlace a coches.idae.es y fecha de consulta; el CSV se descarga como mucho una
  vez por cada publicación y el buscador se consulta poco y espaciado; no se reutilizan el diseño ni los textos de la
  web. No contestaron a la fórmula de atribución, a si hay API ni al calendario del CSV.
