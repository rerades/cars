# Mapa de marcas BEV que venden (o dicen vender) en España. Lo escribe el Researcher.
# NO es el registro de fuentes: nada de aquí es T1 hasta que se registre en registry.yaml.
#
# Cómo leerlo:
# - bev_models: nº aproximado de modelos BEV según UNA fuente T3 (source_id `autonomia-marcas`). Cuenta
#   modelos/variantes de la ficha de ese sitio, sin contrastar con la marca. Solo orientativo.
# - web_es: web oficial española de memoria del Researcher, SIN verificar (no se ha hecho fetch).
#   null = no se conoce con seguridad. Verificar (respuesta + dominio + robots.txt) al registrar.
# - press_room: SIN verificar en todas ("unknown"); se comprobará al registrar cada marca.
# - Ya registradas (fuera de esta lista): Cupra, Polestar.
# - Orden: bev_models de más a menos; empates por orden alfabético; sin dato al final.
# - Sospechosas de no vender realmente en España: marcadas con doubt (la fuente T3 pone "sí" a todas,
#   no es fiable en eso).

sources_used:
  - id: autonomia-marcas
    tier: T3
    url: https://autonomiacocheselectricos.es/marcas
    retrieved: 2026-09-25
    note: >
      Directorio de "66 fabricantes". La lectura de la página fue parcial (Tesla, Zeekr y Yudo
      aparecen sin detalle). Se usa para el nº de modelos y para descubrir marcas.
  - id: carwow-ventas-2026
    tier: T3
    url: https://www.carwow.es/coches-electricos/ventas-espana-2026
    retrieved: 2026-09-25
    note: Confirma que Tesla, BYD, Kia, MG, Leapmotor, Dongfeng, Xpeng, Changan, Geely y Voyah venden BEV en España en 2026.
  - id: busqueda-gama-2026
    tier: T3
    url: https://movilidadelectrica.com/coches-electricos-skoda-2026/
    retrieved: 2026-09-26
    note: Búsquedas web (Skoda Elroq/Epiq, VW ID., Rivian). Solo confirma Skoda y Volkswagen; el resto de marcas añadidas el 2026-09-26 queda sin confirmar.
  - id: anfac-agosto-2026
    tier: T3
    url: https://www.coches.net/noticias/noticias/matriculaciones-turismos-agosto-2026
    retrieved: 2026-09-25
    note: Contexto de mercado (9.562 BEV en agosto de 2026); no da desglose por marca.

