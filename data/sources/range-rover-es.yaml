notes: >
  Web oficial de Range Rover en España (dominio rangerover.com, ruta /es-es/; responde, comprobado el 2026-10-20).
  robots.txt de raíz solo bloquea /lr/* (el configurador), que no se lee. La marca tiene dos BEV: Range Rover Electric
  y Range Rover Sport Electric. Páginas de gama (models-and-specifications) listan versiones con motor eléctrico
  EV450/EV550 (118,5 kWh, tracción total AWD) y un "Precio desde" por versión que es de la versión, no de la
  motorización (hay también PHEV y combustión), así que no vale como PVP del eléctrico. Las páginas electric.html dan
  autonomía WLTP máxima (600 km Range Rover, 609 km Range Rover Sport) sin versiones ni precios. Sala de prensa de JLR
  (media.jlr.com, antes media.jaguarlandrover.com): términos de imágenes sin revisar. Range Rover no tiene datos en el
  IDAE como marca (fetch-idae "RANGE ROVER" falla; "LAND ROVER" devuelve vacío).
