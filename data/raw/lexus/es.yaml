  - "Precios: la web solo da «desde 61.500 €» para la gama ES (incluye híbrido 300h); los precios por versión van en JSON ilegible. La prensa cita 61.500 € (350e) y 65.500-66.100 € (500e), no válidos como fuente de precio. price: null."
