open_questions:
  - "launch: ninguna fuente leída da la fecha desde la que se puede pedir el RZ actual en España (la prensa de oct-nov 2025 habla de configurador y primeras unidades en febrero de 2026, sin confirmar)."
  - "segment: la web lo presenta como «SUV eléctrico / crossover», que no es un término literal de RF-11; queda null."
  - "Precios: la web (lexusauto.es) solo da «desde 52.000 €» para el modelo; el JSON de las páginas de acabados no se pudo asociar a cada versión. La prensa (T3) cita 52.000 €, 52.900 € y 55.900 € para el 350e, pero no vale como fuente de precio. price: null en todas."
  - "Potencia: la web da 165 kW (350e), 280 kW (500e) y 300 kW (550e) por motorización, no por acabado; el IDAE da 167 kW en todas las MC26, que discrepa de la web (T1 prevalece)."
  - "Autonomía: solo 559 (350e Premium Efficiency) y 463 (550e) están en la web; el resto, del IDAE (T2). La web dice hasta 460 km para el 500e, coherente con 460/457/458."
  - "Batería: el IDAE da 77 kWh sin decir si es útil o bruta."
  - "Imagen: la foto de Commons es un RZ 450e de 2023 (antes del lavado de cara), no la gama actual."
  - "Versiones anteriores del IDAE (RZ 300e, 450e; MY23-MY25) no se incluyen: la web actual solo ofrece 350e, 500e y 550e."
