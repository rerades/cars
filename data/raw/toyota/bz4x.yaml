  - "Precio (revisado 2026-10-24): leídas https://www.toyota.es/coches/precios y https://www.toyota.es/coches/bz4x. El texto legal de Advance dice «Precio por financiar: 37.175,01€. PVP al contado: 38.875,01€.» (con promoción y aportaciones incluidas, Oferta válida hasta el 31/10/2026), pero la lista y la cabecera muestran «Desde 39.375,00 €» con la misma cuota de 339,75 €/mes; los dos importes discrepan en 500 € y no se sabe cuál es el de la oferta, así que price: null. No hay PVP limpio sin promoción. Spirit: sin texto legal ni precio asociado con certeza."
  - "Precio (refresco 2026-11-02): el texto legal del Advance sigue con «Oferta válida hasta el 31/10/2026» (ya pasada) y los mismos importes (Precio por financiar 37.175,01 €, PVP al contado 38.875,01 €) frente a «Desde 39.375,00 €» en la lista; la discrepancia de 500 € persiste, así que price: null."
