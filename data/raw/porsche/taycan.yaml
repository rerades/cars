open_questions:
  - "launch: ninguna fuente da la fecha desde la que se puede pedir el Taycan MY2027 en España; queda null."
  - "Batería (kWh): la web no la publica; no se toma del IDAE porque sus filas son de homologaciones anteriores (potencia y WLTP distintos de la web)."
  - "El medio (T3) habla de «Standard, 4, 4S, GTS, Turbo, Turbo S, Turbo GT con sus Black Edition»; la web (T1) lista 22 versiones entre berlina, Sport Turismo y Cross Turismo. Se sigue la web."
  - "Las tres carrocerías van en un solo fichero Taycan; el segmento «Berlina» corresponde a la berlina, el medio da «Familiar» a Sport Turismo y Cross Turismo."
