open_questions:
  - "needs_review: true porque ford.es no dice expresamente que se pueda pedir y no se ha confirmado con un medio (T3) qué versiones se venden hoy: las versiones salen del IDAE (T2), que no dice qué se vende."
  - "Precio: ford.es no publica PVP legible en la ficha; sin precio. Los precios de anuncios de concesionario no valen."
  - "launch: ninguna fuente da la fecha desde la que se puede pedir en España."
  - "ford.es dice «hasta 339 km»; el máximo del IDAE es 334 km (id 610319). Una página antigua de ford.es daba 325 km."
  - "Quitadas las versiones de 83 kWh y 160 kW (RWD, id IDAE 610313; AWD, 610312): en el IDAE constan solo como «Grand Tourneo» (carrocería larga) y ni ford.es ni medios T3 confirman que se vendan como E-Tourneo Custom normal. Las otras cuatro versiones tienen fila IDAE «E-Tourneo Custom» sin Grand (64 kWh: 610317 y 610316; 83 kWh 210 kW: 610319 y 610318). Si se confirma, se pueden añadir."
  - "Nombres de versión: el IDAE agrupa los acabados en una sola fila («Titanium/Active/Titanium X») con las mismas cifras, y ford.es (Trend, Titanium, Active, Sport, Titanium X) no da datos por acabado; no se puede asignar una versión a cada acabado. La de 160 kW se nombra por batería y potencia; Sport sí es un acabado único en la fuente."
  - "Acabado Trend, citado por la ficha de ford.es, no aparece en el IDAE; sin versión."
  - "El IDAE da 83 kWh con 71 kWh útiles; basis queda unknown."
  - "dc_max_kw y ac_max_kw: ford.es solo da tiempo de carga CC (10-80 % en unos 29 min), no la potencia."
  - "El IDAE también tiene filas de 01.2025 con power_kw 85 y 298 km (ids 610482-610486), de homologaciones anteriores; descartadas."
