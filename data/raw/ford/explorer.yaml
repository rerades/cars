open_questions:
  - "Precio: ford.es no publica PVP legible por versión; sin precio. Revisado el 2026-10-22: ficha del Explorer, página de promociones de particulares y buscador de stock de ford.es sin PVP ni tarifa en PDF (solo cuotas); /compra/gama-y-precios da 404. Repetido el 2026-10-23 aceptando ofertas (price_kind: financed): la ficha de ford.es solo da cuota (desde 135 €/mes, entrada 12.300 €, cuota en el mes 12 de 4.050 €, cuota final 15.364 €, 49 meses) y el descuento de 4.500 € sumado al Programa Auto+; ningún precio total, y «las cifras mostradas pueden proceder de distintos acabados». Sin precio."
  - "launch: ninguna fuente da la fecha desde la que se puede pedir en España."
  - "segment: el medio T3 dice «SUV, segmento C»; ningún término literal de RF-11."
  - "Collection es serie limitada según el medio T3: no se ha podido confirmar que se siga vendiendo hoy (needs_review)."
  - "El IDAE tiene también homologaciones de 01.2025 y 11.2025 para las mismas versiones (p. ej. 610433, 610434, 610428) con otras cifras; se usan las filas 05.2026, que coinciden con las potencias del medio T3, y no las de menor wltp_km."
  - "dc_max_kw y ac_max_kw no publicados en las fuentes consultadas."
  - "Reviews: no se enlaza ninguna de diariomotor-es ni motorpasion-es porque el modelo lleva needs_review: true (PRD-006, RF-4). Consultado 2026-10-24."
