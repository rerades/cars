open_questions:
  - "Precio: ford.es solo muestra cuotas de financiación; sin PVP legible por versión; sin precio. Revisado el 2026-10-22: página de promociones de particulares, buscador de stock y búsquedas en ford.es solo dan cuotas de financiación y ofertas de empresa; sin tarifa en PDF; /compra/gama-y-precios da 404. Repetido el 2026-10-23 aceptando ofertas (price_kind: financed): la ficha de ford.es solo da cuota (desde 145 €/mes, entrada 13.050 €, cuota en el mes 12 de 4.050 €, cuota final 16.680 €, 49 meses) y el descuento de 4.500 € sumado al Programa Auto+; ningún precio total ni asociado a una versión. Sin precio."
  - "launch: ninguna fuente da la fecha desde la que se puede pedir en España."
  - "segment: el medio T3 dice «SUV coupé, segmento D»; ningún término literal de RF-11."
  - "El medio T3 no cita la serie Collection del Capri (sí la del Explorer, como serie limitada); consta en el IDAE (05.2026). No confirmado que se venda hoy (needs_review)."
  - "El IDAE tiene también homologaciones de 01.2025 y 11.2025 para las mismas versiones, con otras cifras; se usan las filas 05.2026, que coinciden con las potencias del medio T3, y no las de menor wltp_km."
  - "dc_max_kw y ac_max_kw no publicados en las fuentes consultadas."
