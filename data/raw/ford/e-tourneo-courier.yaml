  - "Precio: releído el 2026-10-24 con fetch-page.ts (palabras PVP, Precio, Oferta válida, €): /turismos/e-tourneo-courier solo da cuota (130 €/mes, entrada 10.550 €, cuota final 15.077 €) y /compra/promociones/plan-auto-plus solo la ayuda; ningún precio total, así que no se guarda precio financed. Anterior: ford.es solo muestra cuotas (desde 130 €/mes, entrada 10.550 €, cuota final 15.077 €, 49 meses), sin PVP legible. motor.es (T3) cita 37.865 € (Trend), 39.565 € (Titanium) y 41.255 € (Active) sin descuento, pero T3 no vale como precio. Sin precio. Revisado el 2026-10-22: promociones de particulares y buscador de stock de ford.es sin PVP ni tarifa en PDF; /compra/gama-y-precios da 404. Repetido el 2026-10-23 aceptando ofertas (price_kind: financed): /compra/promociones/plan-auto-plus solo da la ayuda por modelo (4.500 €) y la ficha solo cuotas; ningún precio total asociado a una versión. Sin precio."
