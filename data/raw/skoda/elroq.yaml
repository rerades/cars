open_questions:
  - "Refresco 2026-11-02 (ADR-0010, punto 8): leída con fetch-page.ts, la ficha solo publica las condiciones con «Oferta válida hasta el 31/10/2026», ya vencida; no hay oferta vigente ni PVP limpio, así que price: null en todas las versiones. Volver a leerla en el siguiente refresco: si la marca publica una oferta nueva, guardarla como financed con su texto literal."
  - "Precios: la ficha solo da «Precio sujeto a financiación desde» (Urban 26.550 €, Selection 27.850 €, Sportline 35.050 €, RS 40.600 €), que incluye la subvención Plan Auto+ de 4.050-4.500 €; no es PVP sin ayudas y no se guarda. No se ha leído un PVP sin ayudas ni un «PVP recomendado financiando» para el Elroq. Revisado 2026-10-22: https://www.skoda.es/modelos/elroq/elroq/skoda-elroq-price-list repite esos mismos importes por versión (también Selection 82 kWh 32.100 €, Sportline 35.050-35.500 €) sin ninguna nota que diga qué incluyen ni su vigencia, y las versiones no casan con las de la ficha (61/82 kWh, 190/286/299/340 CV); no se puede asociar sin duda un PVP limpio. No hay PDF de tarifa enlazado. Leída 2026-10-24 con fetch-page.ts la ficha https://www.skoda.es/modelos/elroq/elroq: las notas 2, 3 y 5 dan un «PVP recomendado financiando» para Urban, Selection y RS, guardado como financed con el texto literal. Sigue sin PVP limpio para ninguna versión."
  - "Sportline: precio sin guardar (2026-10-24). La nota 4 de la ficha da «PVP recomendado financiando» 36.221,36 € para «ELROQ SPORTLINE 140 kW (190 CV) 61 kWh», pero la nota del precio «desde» dice «SPORTLINE 82 kWh - 210kW» y la ficha del Sportline es incoherente, así que no se asocia sin duda a la versión de esta ficha."
  - "WLTP por versión (2026-11-06): la ficha (leída con fetch-page.ts) solo da el máximo de 574 km, que en el IDAE corresponde a ELROQ MY27 Selection 82 kWh 210 kW (id 610714, 574 km; también id 610715, 220 kW dual, 574 km). Esa versión no está en este fichero y la ficha no la nombra, así que wltp_km por versión queda vacío: con los de Urban (id 610712, 451 km), Selection 61 kWh (id 610713, 448 km) y RS (ids 610719/610720, 556 km) el máximo (556) no coincidiría con specs.wltp_max_km (574) y el fichero sería inválido (data-model.md, regla 8). Sportline: IDAE MY27 61 kWh 140 kW 442 km y 82 kWh 210 kW 567 km, sin guardar (ficha incoherente)."
  - "Tracción (2026-11-06): guardada solo donde el IDAE dice «Tracción trasera» (Urban, Selection 61 kWh). RS: el IDAE solo dice «Motor dual» (ids 610719/610720), no «4x4»; no se traduce a awd. Sportline sin tracción por la misma razón que sus demás datos."
  - "Versiones que se venden hoy (2026-11-06): ni la ficha ni la lista de precios (https://www.skoda.es/modelos/elroq/elroq/skoda-elroq-price-list, que repite Selection y Sportline sin kWh) las distinguen más allá de Urban, Selection, Sportline y RS. El IDAE (MY27) homologa además Selection 82 kWh 210 kW y 220 kW dual y Sportline 82 kWh 210/220 kW, que no se añaden sin fuente de la marca."
  - "kW de carga DC y AC: no están en la ficha ni en el IDAE; quedan vacíos."
  - "Oferta (2026-11-06, sin tocar el precio en esta tarea): la ficha, releída con fetch-page.ts, ya dice «Oferta válida hasta el 30/11/2026» (precios financiando Urban 32.364,69 €, Selection 33.615,86 €, Sportline 36.221,36 €, RS 45.871,35 €; precio al contado 34.119,19 / 35.370,36 / 37.975,86 / 47.625,85 €), distinta de la de 31/10/2026 que motivó price: null. Queda para el siguiente refresco de precios."
  - "launch: la ficha no da fecha de inicio de venta en España."
  - "Reviews: no se enlaza ninguna de diariomotor-es ni motorpasion-es porque el modelo lleva needs_review: true (PRD-006, RF-4). Consultado 2026-10-24."
  - "Sportline: batería y potencia sin guardar (revisión 2026-10-16). La ficha sigue dando datos incoherentes (2026-10-17): la nota dice «ELROQ SPORTLINE 82 kWh - 210kW» y la oferta de financiación menciona 140 kW (190 CV) y 61 kWh. Se dejan sin valor hasta que la ficha sea coherente."
