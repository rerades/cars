open_questions:
  - "Precios: la ficha solo da «Precio sujeto a financiación desde» (Urban 26.550 €, Selection 27.850 €, Sportline 35.050 €, RS 40.600 €), que incluye la subvención Plan Auto+ de 4.050-4.500 €; no es PVP sin ayudas y no se guarda. No se ha leído un PVP sin ayudas ni un «PVP recomendado financiando» para el Elroq. Revisado 2026-10-22: https://www.skoda.es/modelos/elroq/elroq/skoda-elroq-price-list repite esos mismos importes por versión (también Selection 82 kWh 32.100 €, Sportline 35.050-35.500 €) sin ninguna nota que diga qué incluyen ni su vigencia, y las versiones no casan con las de la ficha (61/82 kWh, 190/286/299/340 CV); no se puede asociar sin duda un PVP limpio. No hay PDF de tarifa enlazado. Revisado 2026-10-23 en la ficha: además de los «desde» ligados a Plan Auto+, las notas 2 a 5 dan un «PVP recomendado financiando» (Urban 32.364,69 €, Selection 33.615,86 €, Sportline 36.221,36 €, RS 45.871,35 €, válido hasta 31/10/2026, con financiación mínima de 17.000 € y permanencia de 36 meses). No se guarda como financed porque la lectura de la página solo devuelve las notas resumidas y no se puede copiar el texto literal de las condiciones para price_terms; sigue sin PVP limpio."
  - "WLTP por versión, tracción y kW de carga DC no están en la ficha; el IDAE tiene homologaciones MY27 (p. ej. Selection 82 kWh 210 kW: 574 km) pero no se ha cruzado con los nombres comerciales. wltp_km queda sin rellenar en todas las versiones."
  - "launch: la ficha no da fecha de inicio de venta en España."
  - "Reviews: no se enlaza ninguna de diariomotor-es ni motorpasion-es porque el modelo lleva needs_review: true (PRD-006, RF-4). Consultado 2026-10-24."
  - "Sportline: batería y potencia sin guardar (revisión 2026-10-16). La ficha sigue dando datos incoherentes (2026-10-17): la nota dice «ELROQ SPORTLINE 82 kWh - 210kW» y la oferta de financiación menciona 140 kW (190 CV) y 61 kWh. Se dejan sin valor hasta que la ficha sea coherente."
