open_questions:
  - "Precios: los «desde» (18.500 / 20.800 / 27.600 €) incluyen Plan Auto+ y no se usan. Los financed son un resumen de las notas, no su texto íntegro (no se ha comprobado qué descuentos incluyen); revisar. La ficha se contradice: crédito mínimo 19.000 € frente a 17.000 €, y un pie dice «Oferta vigente hasta 30 de junio de 2025»."
  - "Autonomía: la ficha da «hasta 439 km» y «hasta 437 km en ruta», contradictorios; no se rellena wltp_max_km ni wltp_km. El IDAE homologa Epiq MY27 (Urban 55 kWh: 437 km), sin cruzar con la ficha."
  - "launch y pedidos abiertos: la ficha no los indica; modelo marcado needs_review."
  - "Tracción y kW de carga DC no están en la ficha (solo «carga rápida en 24 min»)."
