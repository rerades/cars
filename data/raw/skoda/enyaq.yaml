open_questions:
  - "Refresco 2026-11-02 (ADR-0010, punto 8): leída con fetch-page.ts, la ficha solo publica las condiciones con «Oferta válida hasta el 31/10/2026», ya vencida; no hay oferta vigente ni PVP limpio, así que price: null en todas las versiones. Volver a leerla en el siguiente refresco: si la marca publica una oferta nueva, guardarla como financed con su texto literal."
  - "Precios (2026-10-24): leída con fetch-page.ts la ficha https://www.skoda.es/modelos/enyaq/enyaq; las notas 2, 3 y 4 dan un «PVP recomendado financiando» por versión (Selection 37.128,70 €, Sportline 42.923,70 €, RS 46.438,71 €, hasta 31/10/2026), guardado como financed con el texto literal de la nota. Sigue sin PVP limpio. Las notas «desde» piden capital mínimo de 19.000 € y 84 meses frente a los 17.000 € y 36 meses de las notas de «PVP recomendado financiando»; se guarda la de la nota de cada versión. Los precios «sujeto a financiación desde» (31.400 / 37.650 / 41.150 €) incluyen Plan Auto+ y no se usan. Revisado 2026-10-22 en https://www.skoda.es/modelos/enyaq/enyaq: no hay lista de precios ni PDF de tarifa (solo el catálogo de medidas, https://www.skoda.es/_doc/28280876-c980-403d-82d4-6a305e01cc42) y todo precio va ligado a financiación o a Plan Auto+/CAE; sin PVP limpio. Revisado de nuevo 2026-10-23: los «PVP recomendado financiando» (37.128,70 / 42.923,70 / 46.438,71 €, hasta 31/10/2026; incluyen descuentos y Plan CAE, y el Plan Auto+ solo cubre la cuota del mes 12) siguen sin guardarse porque la lectura solo devuelve un resumen de las notas y no el texto literal para price_terms."
  - "segment: la ficha dice «SUV familiar», que no está en la lista de RF-11; queda null."
  - "WLTP por versión (2026-11-06): la ficha (leída con fetch-page.ts) solo da el máximo de 582 km, que en el IDAE corresponde a ENYAQ MY27 Selection 210 kW 82 kWh (id 610727) y Selection 220 kW 4x4 (id 610728). Esas versiones no están en este fichero y la ficha no las nombra, así que wltp_km por versión queda vacío: con Selection 61 kWh 140 kW (id 610726, 455 km), Sportline 210 kW (id 610729, 577 km) y RS 4x4 (id 610730, 568 km) el máximo (577) no coincidiría con specs.wltp_max_km (582) y el fichero sería inválido (data-model.md, regla 8)."
  - "Tracción (2026-11-06): solo RS, awd, porque el IDAE (id 610730) dice «4x4». Selection 140 kW y Sportline 210 kW no indican tracción en el IDAE y la ficha solo habla de «tracción inteligente 4x4» en general."
  - "Versiones que se venden hoy (2026-11-06): la ficha no las enumera más allá de Selection, Sportline y RS. El IDAE (MY27) homologa además Selection 82 kWh 210 kW y Selection 220 kW 4x4; no se añaden sin fuente de la marca. La ficha dice «Carga del 10% al 80% desde solo 26 minutos» y «28 minutos», sin kW; kW de carga DC y AC quedan vacíos."
