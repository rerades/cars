open_questions:
  - "Refresco 2026-11-02 (ADR-0010, punto 8): la ficha, leída con fetch-page.ts, sigue publicando las notas 2 y 4 con la oferta válida hasta el 31/10/2026, ya vencida, y con los mismos importes; se conservan como financed con su fecha. Sin otro precio en la página; revisar en el siguiente refresco si la marca publica una oferta nueva."
  - "Precios (2026-10-24): leída con fetch-page.ts la ficha https://www.skoda.es/modelos/peaq/peaq; las notas 2 y 4 dan un «PVP recomendado financiando» (Selection 47.152,50 €, Sportline 51.332,50 €, hasta 31/10/2026), guardado como financed con el texto literal. Sigue sin PVP limpio. El «precio al contado» de esas notas (48.907 € y 53.087 €) es mayor (diferencia de 1.754,50 € en ambas, igual que en otras fichas de la marca) y la ficha no explica por qué; las notas «desde» piden capital mínimo de 19.000 € frente a los 17.000 € de las notas de «PVP recomendado financiando». Los «desde» (41.900 / 46.050 €) incluyen Plan Auto+ (4.050 €) y no se usan."
  - "segment: la ficha lo describe como SUV de 5 o 7 plazas sin clase formal; queda null."
  - "La ficha habla de «dos opciones de motor» pero solo detalla la de 210 kW; el IDAE lista también una versión de 220 kW (motor dual). No se añade sin fuente de la marca."
  - "Tracción y kW de carga DC no están en la ficha. wltp_km por versión tampoco (el IDAE da 638 km para Selection 210 kW, sin cruzar)."
  - "launch y pedidos abiertos: la ficha no los indica; modelo marcado needs_review."
