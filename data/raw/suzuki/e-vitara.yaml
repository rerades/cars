open_questions:
  - "Precio: auto.suzuki.es/precios/evitara solo publica el precio de la campaña (28.730, 33.230, 36.230, 36.030 y 39.030 €), que incluye 3.375 € del Programa Auto+ (pendiente de publicar sus bases en el BOE) y descuento de marca, y muestra aparte un 'ANTES' (35.605, 40.105, 43.105, 42.905 y 45.905 €) que la página no llama PVP. Un precio con ayuda no es PVP sin ayudas, así que price: null en todas las versiones hasta que haya un PVP limpio."
  - "launch: ninguna fuente T1 da la fecha de apertura de pedidos. La nota de prensa de precios es del 02/03/2026 y la de la 4x4 (08/04/2026) dice que el lanzamiento comercial 'se está iniciando en estos días'."
  - "segment: las notas de Suzuki lo llaman 'SUV' sin tamaño ni letra de segmento; no se traduce por tamaño (longitud 4.275 mm según la nota de lanzamiento)."
  - "Potencia de las 4x4: Suzuki da 135 kW combinados y el IDAE 175,6 kW; se usa el valor T1. Las cifras de autonomía y batería salen del IDAE (T2) porque la web de Suzuki no publica WLTP ni kWh por versión en lo leído; la web no da potencia de carga DC (solo 10-80 % en 45 min)."
  - "Las versiones 4x2 no declaran tracción en la fuente; no se escribe drivetrain."
