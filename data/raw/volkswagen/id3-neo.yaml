  - "Precio: la ficha solo muestra 25.600 € ligado a financiación, descuentos y Plan Auto+ (4.500 €), sin condiciones coherentes (permanencia 36 vs 60 meses); no se guarda como pvp ni financed. Revisado de nuevo 2026-10-23 (id3.html): los 25.600 € llevan restados 1.000 € de Plan Auto+ (ayuda pública) y 1.000 € de CAES, y la letra pequeña se contradice (capital mínimo 15.000 €, 60 meses en el texto legal y 36 en el ejemplo); un precio con ayudas públicas restadas no puede ser financed. Revisado 2026-10-22: id3-neo.html (nota legal: 25.600 € incluye descuentos de marca y concesionario, bonificaciones VWFS, Plan Auto+ y CAES, solo con financiación), configurador.html (app JS, sin precios legibles), modelos/stock.html (sin precios de lista) y búsqueda en volkswagen.es: no hay tarifa PDF ni PVP sin oferta. Style no aparece en ninguna página de volkswagen.es, por eso no se añade."
  - "Batería y autonomía de Life 125 kW: la ficha dice 79 kWh (probable errata) y 628 km; un medio (T3, motor1) da Life 52/61/84 kWh. Sin confirmar, no se guardan (wltp_km en todas las versiones o en ninguna)."
