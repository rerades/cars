open_questions:
  - "needs_review: true porque volkswagen.es no dice qué versiones se pueden pedir hoy (solo muestra ofertas de financiación) ni liga cada potencia a su versión; status on_sale se apoya en esas ofertas."
  - "Precio: no se guarda. Releído 2026-10-24 con fetch-page.ts (id3.html, redirige a id3-neo.html; palabras PVP, Precio, Oferta válida, 25.600, Life): la nota legal liga 25.600 € a «ID.3 Neo Life 125kW (170CV)» (la versión del fichero), pero dice literalmente «El precio incluye IVA, Impuestos de Matriculación, Transporte, descuento de marca y concesionario, bonificaciones de Volkswagen Financial Services, 1.000€ de Plan Auto+ incluidos y plan CAES por importe de 1.000€» y «El precio indicado incluye la ayuda del programa ... (Programa PLAN AUTO+) ... por importe de 4.500€ sujeto a aprobación»; con ayudas públicas restadas no es pvp ni financed, y el texto se contradice (60 meses de duración mínima vs 36 de permanencia). Sin PVP sin oferta en esa página. Antes: la ficha solo muestra 25.600 € ligado a financiación, descuentos y Plan Auto+ (4.500 €), sin condiciones coherentes (permanencia 36 vs 60 meses). Revisado 2026-10-23 (id3.html): los 25.600 € llevan restados 1.000 € de Plan Auto+ (ayuda pública) y 1.000 € de CAES, y la letra pequeña se contradice (capital mínimo 15.000 €, 60 meses en el texto legal y 36 en el ejemplo); un precio con ayudas públicas restadas no puede ser financed. Revisado 2026-10-22: id3-neo.html (nota legal: 25.600 € incluye descuentos de marca y concesionario, bonificaciones VWFS, Plan Auto+ y CAES, solo con financiación), configurador.html (app JS, sin precios legibles), modelos/stock.html (sin precios de lista) y búsqueda en volkswagen.es: no hay tarifa PDF ni PVP sin oferta. Style no aparece en ninguna página de volkswagen.es, por eso no se añade."
  - "Life 125 kW: batería (50 kWh) y WLTP (415 km) salen del IDAE (fetch-idae.ts «Volkswagen Turismos», 2026-11-08, id 609272). La ficha de volkswagen.es dice 79 kWh y 628 km, que en el IDAE corresponden a Neo Life 170 kW (231 CV), no a la de 125 kW; no se guardan los de la web para esta versión. Tracción: el IDAE no la publica y volkswagen.es no la da."
  - "Versiones: sin confirmar cuáles se venden hoy (el IDAE no lo dice y volkswagen.es solo muestra la Life 125 kW). El IDAE (MY27) registra además Neo Life 140 kW (190 CV) 58 kWh 492 km (id 609273), Life 170 kW (231 CV) 79 kWh 628 km (609274), Style 140 kW 58 kWh 485 km (609275) y Style 170 kW 79 kWh 627 km (609276); no se añaden como versiones sin fuente que diga que se venden."
  - "launch: ninguna fuente da la fecha desde la que se puede pedir en España."
  - "segment: la fuente no usa un término de la lista de RF-11 (motor1 dice «compacto» en T3, pero sin confirmación de marca)."
  - "Reviews: no se enlaza ninguna de diariomotor-es ni motorpasion-es porque el modelo lleva needs_review: true (PRD-006, RF-4). Consultado 2026-10-24."
  - "Refresco 2026-11-02 (fetch-page.ts, id3.html): la ficha sigue mostrando 25.600 € con «Oferta válida hasta el 31/10/2026», ya vencida, y la misma nota legal (ayudas Plan Auto+ y CAES incluidas, 60 vs 36 meses); sigue sin PVP limpio, el precio queda null. La potencia de Life 125 kW sale del IDAE (retrieved 2026-10-14): fetch-idae.ts VOLKSWAGEN falla («IDAE has no brand»), no se ha podido releer y su fecha no cambia."
