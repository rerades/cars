  - "needs_review: true porque volkswagen.es no dice qué versiones se pueden pedir hoy (solo muestra ofertas de financiación) ni liga cada potencia a su versión; status on_sale se apoya en esas ofertas."
  - "Precio: no se guarda. Releído 2026-10-24 con fetch-page.ts (id7.html; palabras PVP, Precio, Oferta válida, 40.200, Business): la nota legal liga 40.200 € a «ID.7 Business 210 kW (286CV)», acabado que no es ninguna versión del fichero (Pro, Pro S, GTX), e incluye literalmente «1.000€ de Plan Auto+ incluidos y plan CAES por importe de 1.000€» y «la ayuda del programa ... (Programa PLAN AUTO+) ... por importe de 4.050€»; con ayudas públicas restadas y sin versión asociada no se guarda. Sin PVP sin oferta. Antes: «desde 40.200 €» con Compra Flexible, sin asignar a un acabado. Revisado de nuevo 2026-10-23 (id7.html): solo «Desde 40.200 € sujeto a financiación o 35 cuotas de 300 €/mes + 1 cuota de 4.050 € (en el mes 12) con Compra Flexible VW», que la nota legal liga a «ID.7 Business 210 kW», un acabado que no es ninguna versión del fichero (Pro, Pro S, GTX); sin asociación clara a una versión ni letra pequeña legible, no se guarda. Tampoco hay PVP sin oferta. Revisado 2026-10-22: la nota legal da 40.200 € (ID.7 Business 210 kW) con oferta vigente hasta 31/10/2026; configurador.html (app JS) y modelos/stock.html sin precios de lista; no hay tarifa PDF."
  - "Batería, WLTP y potencia de Pro, Pro S y GTX salen del IDAE (fetch-idae.ts «Volkswagen Turismos», 2026-11-08), filas MY26 (el IDAE no da fecha, solo MY25/MY26/MY27); detalle de la elección en la note de cada valor. La web da 707 km en el texto y «hasta 702 km» en cabecera: ambas cifras existen en el IDAE para Pro S. Tracción: ninguna fuente leída la publica."
  - "Versiones: sin confirmar cuáles se venden hoy (el IDAE no lo dice). El IDAE (MY27) registra además ID.7 Business, Style (77 y 86 kWh) y GTX 4Motion; la web liga 40.200 € a «Business 210 kW». No se añaden como versiones sin fuente que diga que se venden. ID.7 Tourer también está en el IDAE, sin fichero."
  - "segment: no aparece un término de RF-11. launch: sin fecha de pedidos."
  - "ID.7 Tourer, ID.Polo, ID.Tiguan, ID.Cross, ID.Buzz, e-Caravelle y ID.3 GTI: sin fichero, no se han leído sus fichas ni hay fuente de versiones en esta ejecución."
