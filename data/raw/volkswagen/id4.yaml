open_questions:
  - "needs_review: true porque volkswagen.es no dice qué versiones se pueden pedir hoy (solo muestra ofertas de financiación) ni liga cada potencia a su versión; status on_sale se apoya en esas ofertas."
  - "Precio: no se guarda. Releído 2026-10-24 con fetch-page.ts (id4.html; palabras PVP, Precio, Oferta válida, 32.400, Pro): la nota legal da 32.400 € para «ID.4 Pro 210 kW (286V) Automático 1vel.» y dice literalmente «El precio incluye ... descuento de marca y concesionario, bonificaciones de Volkswagen Financial Services, 1.000€ de Plan Auto+ incluidos y plan CAES por importe de 1.000€» y «El precio indicado incluye la ayuda del programa ... (Programa PLAN AUTO+) ... por importe de 4.500€ sujeto a aprobación»; con ayudas públicas restadas no es pvp ni financed (y el texto se contradice: 60 meses de duración mínima vs 36 de permanencia). Además el PVP financiando que da la nota 3 es 38.386,66 € para esa misma versión, pero también con descuentos y ayudas incluidos. Sin PVP sin oferta. Antes: «desde 32.400 €» sujeto a financiación, sin PVP limpio. Revisado de nuevo 2026-10-23 (id4.html): el precio es «Desde 32.400 € sujeto a financiación o 35 cuotas de 250 €/mes + 1 cuota de 4.500 € (en el mes 12) con Compra Flexible VW» para «ID.4 Pro 210 kW», sin que la ficha ligue esa cifra con claridad a la versión «Pro» ni se pueda leer la letra pequeña completa (la lectura de la página la trunca), y el pago de 4.500 € del mes 12 depende del Plan Auto+ (ayuda pública); sin términos literales ni descartar ayudas restadas, no se guarda como financed. Tampoco hay PVP sin oferta. Revisado 2026-10-22: la nota legal de id4.html da 32.400 € para ID.4 Pro 210 kW con descuentos y financiación; configurador.html (app JS) y modelos/stock.html sin precios de lista; no hay tarifa PDF."
  - "Datos por versión (kWh, WLTP, kW, tracción) no publicados en la ficha. La autonomía «hasta 560 km» no dice si es WLTP."
  - "segment: la ficha dice «SUV», que no es un término de la lista de RF-11."
  - "launch: ninguna fuente da la fecha desde la que se puede pedir. Un medio (T3) sugiere nuevos ID.4/ID.7 fabricados en España en 2027; confirmar qué se vende hoy."
  - "Reviews: no se enlaza ninguna de diariomotor-es ni motorpasion-es porque el modelo lleva needs_review: true (PRD-006, RF-4). Consultado 2026-10-24."
  - "Refresco 2026-11-02 (fetch-page.ts, id4.html): valores de status y specs releídos y sin cambios. La ficha sigue mostrando 32.400 € con «Oferta válida hasta el 31/10/2026», ya vencida, con la misma nota legal (ayudas Plan Auto+ y CAES incluidas); sigue sin PVP limpio, el precio queda null."
