  - "e-Motion 210 kW: la oferta de la ficha dice 79 kWh, pero el IDAE solo tiene e-Motion 210 kW con 86 kWh (ids 611844 y 612026); no se guarda batería ni WLTP para esta versión. La ficha cita también «hasta 443 km» (e-Motion) y «hasta 469 km» (Pro 7 plazas), que no coinciden con ninguna fila del IDAE."
