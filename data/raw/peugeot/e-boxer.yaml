open_questions:
  - "needs_review: el estado sale de un artículo T3 (forococheselectricos, 2026-11-07) que cita la oferta de Peugeot España; www.peugeot.es da 403 y ofertas.peugeot.es/coches-electricos-hibridos no muestra el e-Boxer en el texto leído. El IDAE no dice qué versiones se venden hoy: solo la fuente T3 confirma que se ofrece la L3H2 de 3,5 t (coincide con la primera fila); las demás versiones no están confirmadas."
  - "Autonomía: forococheselectricos y motor16 citan 424 km para la L3H2 de 4,25 t; el IDAE (sin fecha de homologación) trae 4,25 L3 H3 = 409 km y 4,25 L4 H3 = 406 km, y no trae la L3H2 de 4,25 t. Se guardan solo las cifras del IDAE."
  - "Precio: sin PVP ni precio financiado T1 legible. La oferta (410 €/mes + IVA, 48 meses, «37.489,88 euros sin IVA») la cita solo la prensa (T3) y es sin IVA; ofertas.peugeot.es no la muestra. price null."
  - "launch: ninguna fuente da la fecha de inicio de venta en España del e-Boxer de 110 kWh (motor16 y forococheselectricos, 2026-11, hablan de «llega» sin fecha)."
  - "Imagen: busqué en Wikimedia Commons (API, «Peugeot e-Boxer») y no hay ninguna foto del e-Boxer; solo del Boxer térmico (p. ej. File:Peugeot Boxer (2024) DSC 8787.jpg), que no se registra porque no es la versión eléctrica. images: []."
