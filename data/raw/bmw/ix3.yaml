open_questions:
  - "Reviews (2026-10-24): Diariomotor no tiene una prueba del iX3 actual (solo noticias, ficha y una prueba en vídeo del iX3 de 2021, generación anterior)."
  - "Segmento sin fuente: la ficha bmw.es no se pudo abrir y el comunicado no lo clasifica (el iX3 se aloja en /coches-bmw/x/, familia X)."
  - "iX3 40: el comunicado de 2026-07-20 da \"aproximadamente 63.650 €\"; falta PVP definitivo y confirmar si ya se vende (anunciado para verano de 2026)."
  - "iX3 50 xDrive: capacidad de batería y carga AC no publicadas en el comunicado; precio sin reverificar en el configurador (bmw.es dio timeout de nuevo el 2026-10-31)."
  - "Refresco 2026-10-31: la sala de prensa se ha movido de www.press.bmwgroup.com/spain/ a newsroom.bmwgroup.com/emea/es/ (301). Los valores técnicos se releyeron en la URL nueva (WebFetch). Pero el robots.txt de ambos hosts respondió 503 y fetch-page.ts no pudo leerlas, así que el precio de 69.900 € NO se ha vuelto a demostrar: se deja con su URL y fecha de 2026-10-04. Un medio (electrive, T3, 2026-02-02) dice que el configurador lo subió a 70.900 €: confirmar con T1. Lo mismo para drivetrain, status (bmw.es sin abrir) y la nota de launch."
  - "Resto de la gama BMW (iX1, iX2, i4, i5, i7, iX): sin fichero porque bmw.es no se pudo leer y los comunicados de precio hallados son antiguos (iX1: 2023)."
  - "Posible nueva variante: la newsroom publica «EL NUEVO BMW iX3 M60 xDrive» (2026-10-15, https://newsroom.bmwgroup.com/emea/es/el-nuevo-bmw-ix3-m60-xdrive/); no añadida en un refresco."
