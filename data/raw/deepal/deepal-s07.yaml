  - "Precio: se usa el PVPR del configurador (46.990 €, acabado «Standard», 2026-10-21). La promoción (changaneurope.com/es/promociones/changan-deepal-s07) da 43.215 € al contado y 36.490 € financiado con Plan Auto+ y CAE, que no se usan. El configurador no dice RWD/MY26: se asocia a la única versión BEV de la ficha."
  - "Versión: el comunicado de enero 2026 y medios daban 160 kW / ~80 kWh / 475 km (versión anterior); la web actual muestra MY26 de 190 kW. Se asume que solo se vende la MY26 (la promoción habla de «MY'26 BEV»); confirmar. La web da 728 km de «autonomía urbana», no WLTP."
  - "Lanzamiento: ninguna fuente da la fecha desde la que se pueden pedir. launch: null."
  - "Segmento: el comunicado lo describe como SUV de tamaño medio («D-SUV»), no es término literal de RF-11. segment: null."
