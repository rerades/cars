open_questions:
  - "Precio: la web oficial (changaneurope.com/es/promociones/gama-deepal-s05) da precio «al contado» (Pro 33.665 €, Max 37.565 €, AWD 41.265 €) y «financiado» (26.490/30.390/34.090 €) con ayudas Plan Auto+ y CAE y letra pequeña que no se puede copiar entera; no se rotula como PVP. Además la tabla de financiación de la Max da otras cifras (36.760,41 € / 32.585,41 €) y las fechas de validez se contradicen. Se deja price: null."
  - "Lanzamiento: ninguna fuente da la fecha desde la que se pueden pedir (el comunicado del 2026-01-29 solo dice que la red arranca con 32 puntos de venta a finales de enero). launch: null."
  - "Segmento: el comunicado de prensa lo describe como «SUV eléctrico compacto», que no es el término literal de RF-11. segment: null."
  - "Autonomía: la web muestra cifras «urbanas» (605/550 km) y Highmotor/comunicado dan 485/445 km; se usa la homologación del IDAE (WLTP). El IDAE no dice qué versiones se venden hoy; confirmadas Pro, Max y AWD Max por la página de promociones. Existen además versiones PHEV (no incluidas)."
  - "Batería: el IDAE no indica si es útil o bruta (basis: unknown); el comunicado da 68,8 kWh."
  - "Imagen: el fichero de Commons es un S05 en el IAA 2025 sin indicar si es BEV o PHEV (misma carrocería)."
