  - "Precio: el «PVPR Financiando» de https://www.byd.com/es-es/promociones (2026-11-07) no se guarda. La nota (2) de la misma página incluye un adelanto de 2.250 € del Plan Auto+ en los descuentos, y no queda claro si ese PVPR lo resta; las ayudas públicas nunca se restan (researcher.md). Falta un PVP sin oferta o una nota que diga que el precio no incluye la ayuda."
  - "segment: la web dice «DOLPHIN SURF (Segmento A)» y «hatchback de 5 puertas», sin ningún término de la lista de RF-11 ni de la tabla de equivalencias; sin segmento."
  - "launch: ninguna fuente da la fecha de inicio de venta en España."
  - "Precios: la web solo publica un «PVPR Financiando» de la Active (color Lime Green) dentro de una promoción hasta el 30/11/2026; no hay PVP sin oferta. Boost y Comfort sin precio."
  - "Active: potencia de carga CC no publicada."
  - "Batería: la web no indica si es útil o bruta."
