open_questions:
  - "Autonomía WLTP por versión no asignable: la web solo da «hasta 409 km» para evolution con pack confort 52 kWh; la nota de prensa de 04/03/2025 daba 308 km (40 kWh) y 409 km (52 kWh). Solo se publica specs.wltp_max_km."
  - "Discrepancia de precio web/prensa: la web muestra precios «desde» con «este importe incluye promociones» (evolution 21.974 €), mientras la nota de prensa de 04/03/2025 daba evolution 29.900 €, confort 32.900 €, techno 34.900 € e iconic 36.900 € «sin descuentos ni ayudas». No se ha encontrado un PVP vigente sin promociones en la web (el configurador no se pudo leer); los precios guardados son los de la web con promociones. Se mantiene needs_review."
  - "Batería por versión, carga CC/CA y tracción no publicadas en la web leída."
  - "R4 Van (furgón N1) no incluido: no es turismo y no se ha leído su ficha."
