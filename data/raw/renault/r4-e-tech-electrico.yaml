open_questions:
  - "launch no obtenido: prensa.renault.es no se puede usar: sus términos excluyen el uso con fines de información (ver data/sources/renault-press.yaml)."
  - "Autonomía WLTP por versión no asignada: la página del modelo da «hasta 409 km» (specs.wltp_max_km) y motores.html (2026-11-06) da «hasta 415 km» (52 kWh) y «hasta 310 km» (40 kWh), versión evolution. Dos páginas de renault-es discrepan (409 vs 415) y no se resuelve; el IDAE (fetch-idae.ts RENAULT, 2026-11-06) lista R4 EV40 y EV52 pero esas filas no se han volcado."
  - "Sin PVP sin promociones: la web muestra precios «desde» con «este importe incluye promociones» (evolution 21.974 €). No se ha encontrado un PVP vigente sin promociones en la web (el configurador no se pudo leer); los precios guardados son los de la web con promociones."
  - "Carga CC/CA solo publicada para evolution 120 CV (ficha técnica, 2026-11-06); las versiones de 150 CV no la dan en la ficha leída. Tracción no publicada."
  - "R4 Van (furgón N1) no incluido: no es turismo y no se ha leído su ficha."
