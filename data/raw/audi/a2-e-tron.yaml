  - "Segmento: el medio lo llama «hatchback», que no es un término de RF-11 ni está en la tabla; null. El artículo de gama del mismo medio (6/11/2026) aún decía «llegada en 2027»; prevalece el artículo específico, más reciente."
  - "launch: pedidos aún no abiertos en España según el medio; la fecha es de primeras entregas, prevista, no de inicio de pedidos."
  - "Versiones: los nombres son por potencia (kW), sin nombre comercial confirmado por T1; el medio indica que el 240 kW solo se ofrece con acabado Black Line."
