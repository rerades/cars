open_questions:
  - "Precio: audi.es responde 403 a la lectura automática y no hay otra fuente T1; todas las versiones con price null."
  - "Batería de las versiones de carrocería compacta: las filas MY27 del IDAE dan 59, 75,8, 77 y 94,9 kWh de forma incoherente (p. ej. 94,9 kWh en un Q4), así que no se ha guardado battery_kwh en esas tres versiones."
  - "Tracción de las versiones sin «quattro»: ninguna fuente leída la da de forma coherente (autonomiacocheselectricos y la nomenclatura se contradicen); no se guarda."
  - "El medio (2026-04-30) cita 59/77 kWh y el IDAE 63/82 kWh en el Sportback: probablemente neta frente a bruta, sin confirmar."
  - "Entregas del Q4 e-tron renovado: el medio (2026-04-30) las programa para el verano de 2026; no se ha comprobado que ya se entreguen."
