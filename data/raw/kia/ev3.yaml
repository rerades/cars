open_questions:
  - "Precio de todas las versiones (2026-10-23): mirado en /modelos/ev3/descubrelo/ (sin precio), /modelos/ev3/precios/ y /campana-hibridos-y-electricos/ (404) y el configurador (interactivo, no legible). Sin lista de tarifas ni PDF de PVP. Solo hay 'Desde' en páginas de concesionario (24.530 €, 'financiando desde 23.610 €', 28.620 €), que discrepan, no se asocian a una versión y no son T1 de marca: no se usan. La nota del configurador (oferta con entrega de usado y financiación mínima) no es utilizable sin versión asociada."
  - "Refresco 2026-10-31: la ficha se contradice en la autonomía. Titular y nota (2): 773 km (batería 81,4 kWh, tracción trasera, llantas 17\"), pero otro párrafo dice 'La batería Long Range del Kia EV3 homologa hasta 605 km en carretera que en el caso de ir por ciudad llegaría hasta los 773 km'. 773 km podría ser el ciclo urbano y no el WLTP combinado; se mantiene la cifra publicada como titular. Además, la capacidad es 63/84 kWh en un párrafo y 81,4 kWh en la versión Long Range en otro."
  - "Precio (2026-10-31): el configurador (kia.com/es/quiero-un-kia/configurador/) solo da condiciones de una oferta financiada (Cetelem FlexiPlan, válida hasta el 26/10/2026, ya caducada) sin importe por versión en el texto leído; /modelos/ev3/precios/ sigue en 404. Sin PVP ni precio financed utilizable."
  - "launch: ninguna fuente T1 con la fecha de inicio de venta en España (solo T3 sitúa el inicio a finales de 2024)."
  - "segment: la ficha no clasifica el modelo; sin fuente, queda vacío."
  - "Potencia, batería y autonomía por versión no publicadas en la ficha estática (solo en el configurador)."
