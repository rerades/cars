  - "Especificaciones por versión (2026-11-06): la ficha estática no las da. Del IDAE (idae-es, T2): todas las filas EV4 dan 150 kW; el hatchback GT-Line solo existe en Long Range (81 kWh, 584 km), añadidos batería y potencia a EV4 GT-Line. Air y Earth Launch Edition tienen 58 kWh y 81 kWh según la fila, y los nombres de versión del fichero (Air, Earth Launch Edition, Fastback GLS-Earth, Fastback GT-Line) no coinciden uno a uno con los del IDAE (p. ej. «Earth GT-Line Long Range», «Business»): sin asignar. wltp_km no se añade: el IDAE da 440/425/594/584/625 km (hatchback) y 440/612 km (Fastback) y la ficha 633 km (T1, prevalece), y la regla 8 exige coincidencia con wltp_max_km. Tracción por versión no publicada. El IDAE no dice qué versiones se venden hoy."
  - "Hatchback y Fastback se publican como modelos separados en la gama de Kia España; aquí van juntos como versiones de EV4 (decisión pendiente)."
