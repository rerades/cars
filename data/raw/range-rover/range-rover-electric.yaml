open_questions:
  - "Precio: la página de gama da un \"Precio desde\" por versión (p. ej. SE 152.250 €) sin decir qué motorización cubre (hay PHEV y combustión). La prensa (T3) cita 163.250 € como precio de partida del eléctrico, pero no vale como única fuente. Todos los precios en null. Revisado 2026-10-23: electric.html no trae precios (solo enlaza al configurador, que no es legible sin JavaScript); models-and-specifications.html repite los \"Precio desde\" por acabado sin separar motorización (EV, PHEV, diésel, gasolina); offers.html solo tiene ofertas del PHEV P460e Autobiography; no hay PDF de tarifas enlazado. Sin PVP ni oferta del eléctrico en T1, no se guarda ni price_kind pvp ni financed."
  - "wltp_km por versión: la web solo da 600 km como máximo del modelo; no hay cifra por versión (EV450/EV550). Se deja solo specs.wltp_max_km. Potencia: tampoco hay kW de sistema por versión."
  - "launch: ninguna fuente da la fecha desde la que se puede pedir (la prensa del 2026-09-02 dice solo que ya están abiertos). Entregas sin fecha."
  - "segment: la web lo presenta como SUV de lujo; no es un término de la lista de RF-11."
  - "Versiones: la lista sale de las que muestran motor EV en la página de gama; no se confirma qué otras (Westminster, 7 plazas) tendrán eléctrico. El nombre de versión mezcla acabado y motor (EV450/EV550) y la batalla larga se deduce de la URL del configurador."
  - "Imagen (2026-10-22): Commons solo tiene fotos del Range Rover L460 de combustión o sin motorización indicada, ninguna del eléctrico; sin foto válida: images []."
  - "IDAE: sin datos de Range Rover/Land Rover; homologación WLTP por versión pendiente."
