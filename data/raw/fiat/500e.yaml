open_questions:
  - "price: fiat.es devuelve 403; sin PVP ni precio financiado en fuente T1. Un T3 cita 24.450 € (berlina), 33.450 € (3+1) y 34.950 € (cabrio) y otro (Diariomotor, octubre 2026) 24.112 € a 33.112 €, que no valen como precio."
  - "Versiones: nombres comerciales y lista tomados de la tabla de octubre 2026 de Diariomotor (T3), que no da batería ni autonomía por versión; fiat.es devuelve 403 y no hay confirmación T1. La de 23,8 kWh sigue a la venta según esa tabla (POP e Icon de 24 kWh), así que se mantiene."
  - "wltp_km: las filas del IDAE no traen fecha (solo códigos MY23/MY25), así que no se puede saber cuál es la más reciente; se aplicó la fila de menor wltp_km por versión y carrocería (empates: id mayor). Las cifras 313 km de Icon 42, La Prima 3+1 y Business vienen de homologaciones antiguas (ids 5407xx); si fiat.es publica 320 km conviene corregirlas."
  - "Cabrio: el IDAE tiene filas de cabrio (p. ej. 611264, 310 km) pero la tabla de Diariomotor no lista versión cabrio; no se incluye."
  - "launch: ninguna fuente da la fecha desde la que se puede pedir en España."
  - "segment: ninguna fuente leída usa un término literal de la lista de RF-11 (el medio lo describe como «pequeño urbano»); queda vacío."
  - "Imagen: es el 500e de 2020 (mismo modelo que el actual)."
