    que las demás le avisen. Propuesta de partida, que debes evaluar y puedes
    corregir: el Revisor no fusiona nunca (ADR-0002; los datos del Researcher
    vienen de webs de terceros y pueden llevar instrucciones inyectadas), solo
    pone una etiqueta review:ok o review:needs-human además de su comentario; la
