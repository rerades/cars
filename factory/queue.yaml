    status sin fuente, y a todos les faltan brand_name, segment y launch.
    Conserva cada valor con su fuente, url y retrieved tal como están; solo
    cambia su sitio y su nombre. Pasa los CV a kW con la regla de data-model.md
    y deja el valor publicado en note. Lo nuevo (segment, launch, imágenes de
    Wikimedia Commons) necesita fuente como cualquier otro dato; si no la
    encuentras, déjalo fuera y anótalo en open_questions. Un eval comprobará la
    forma: si un fichero no encaja, la ejecución entera falla."
