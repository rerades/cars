- agent: researcher
  task: "Migra los seis ficheros de data/raw/cupra/ y data/raw/polestar/ al
    esquema de docs/architecture/data-model.md (ADR-0008). Hoy no lo cumplen:
    Cupra usa model_level y power_cv, Polestar usa specs con otros nombres y
    status sin fuente, y a todos les faltan brand_name, segment y launch.
    Conserva cada valor con su fuente, url y retrieved tal como están; solo
    cambia su sitio y su nombre. Pasa los CV a kW con la regla de data-model.md
    y deja el valor publicado en note. Lo nuevo (segment, launch, imágenes de
    Wikimedia Commons) necesita fuente como cualquier otro dato; si no la
    encuentras, déjalo fuera y anótalo en open_questions. Un eval comprobará la
    forma: si un fichero no encaja, la ejecución entera falla."
- agent: developer
  task: "Adapta web/src/lib/data.ts al esquema de docs/architecture/data-model.md
    (ADR-0008) y quita los parches que aceptan dos formas (model_level y specs,
    status con o sin fuente). Deriva lo que dice la sección 5: precio desde,
    autonomía máxima (versiones y, si no hay, specs.wltp_max_km) y tracción del
    modelo. Añade segment, launch y brand_name al modelo normalizado, e images
    con license y attribution. Las pruebas usan fixtures con la forma del
    ejemplo de data-model.md, no los YAML reales de data/, que la migración de
    Cupra y Polestar está cambiando en otra PR. Cada regla de la sección 5 queda
    cubierta por una prueba que falle si se rompe. No toques data/ ni las
    páginas."
