- agent: architect
  task: "Redacta ADR-0011 (usa ese número): cómo publican los agentes, la última
    decisión pendiente de docs/architecture/overview.md. Hoy cada ejecución abre
    su PR (auto_pr en factory/budgets.yaml), el Revisor comenta cada noche a las
    06:30 (factory/launchd/com.darkfactory.reviewer.plist.example) y una persona
    fusiona. El responsable quiere que las PR que salgan bien entren sin persona y
    que las demás le avisen. Propuesta de partida, que debes evaluar y puedes
    corregir: el Revisor no fusiona nunca (ADR-0002; los datos del Researcher
    vienen de webs de terceros y pueden llevar instrucciones inyectadas), solo
    pone una etiqueta review:ok o review:needs-human además de su comentario; la
    fusión la hace el orquestador, código sin modelo, solo si la PR tiene
    review:ok, la CI en verde, ningún conflicto y toca únicamente rutas de una
    lista permitida (por ejemplo docs/ y data/raw/, nunca factory/, .claude/,
    .github/ ni web/). Decide también cómo se avisa de las review:needs-human,
    cómo queda registrada cada fusión automática y cómo se vuelve atrás (git
    revert del merge), y qué pasa después de fusionar (despliegue en Render según
    ADR-0009, vistas previas por PR). Estado propuesta; tacha la línea en
    overview.md con el enlace a ADR-0011."
